<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饗賓集團冷鏈配送系統 - 司機任務台</title>
    
    <!-- 引入 html2canvas 截圖工具 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 15px;
            color: #1e293b;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 司機選擇與控制面板 */
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .control-panel label {
            font-size: 16px;
            font-weight: bold;
            color: #475569;
        }
        .driver-select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            outline: none;
            cursor: pointer;
            background: #f8fafc;
            color: #000;
        }
        .btn-refresh {
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 任務卡片清單 */
        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .task-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.05);
            border-left: 5px solid #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgb(0 0 0 / 0.1);
        }
        .task-card.pending {
            border-left-color: #eab308; /* 黃色：待簽收 */
        }
        .task-card.completed {
            border-left-color: #22c55e; /* 綠色：已簽收 */
            opacity: 0.85;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .store-name {
            font-size: 18px;
            font-weight: bold;
            color: #0f172a;
        }
        .task-status-badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 9999px;
            font-weight: bold;
        }
        .status-pending { background-color: #fef9c3; color: #854d0e; }
        .status-completed { background-color: #dcfce7; color: #166534; }
        .task-details {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        /* 件數核對主單 - 為了保證截圖背景，強制不透明白底與深色文字 */
        .sheet-container {
            background: #ffffff !important; 
            color: #000000 !important;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            display: none; /* 預設隱藏 */
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            border-bottom: 2px solid #ef4444;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: #dc2626 !important;
            margin: 0;
            font-size: 22px;
        }
        .info-grid {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #000000 !important; /* 強制頂部單號資訊變黑 */
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1.1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .column-box {
            background-color: #ffffff;
            border: 1px solid #94a3b8; /* 加深外框線 */
            border-radius: 8px;
            padding: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #cbd5e1; /* 加深內網格線 */
            text-align: left;
            font-size: 13px;
            color: #000000 !important; /* 強制文字純黑 */
        }
        th {
            font-weight: bold;
            color: #000000 !important;
            background-color: #f1f5f9;
        }
        
        .column-title {
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .blue-title { background-color: #e0f2fe; color: #0369a1; }
        .green-title { background-color: #dcfce7; color: #15803d; }
        .amber-title { background-color: #fef3c7; color: #b45309; }

        .qty-input {
            width: 50px;
            padding: 4px;
            font-size: 13px;
            text-align: center;
            border: 1px solid #475569; /* 加深輸入框格線 */
            border-radius: 4px;
            color: #000000 !important; /* 強制輸入數字變極黑 */
            font-weight: bold;
            background-color: #ffffff;
        }
        .qty-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-top: 2px solid #94a3b8;
            padding-top: 20px;
            margin-top: 15px;
        }
        .signature-card {
            background-color: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 10px;
            padding: 15px;
            color: #000000 !important;
        }
        .signature-card.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .signature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .canvas-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        canvas {
            border: 1px dashed #475569;
            border-radius: 8px;
            background: #ffffff;
            touch-action: none;
        }
        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn {
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-blue { background-color: #2563eb; }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #16a34a; }
        .btn-green:hover { background-color: #15803d; }

        @media (max-width: 900px) {
            .main-grid, .bottom-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 頂部控制面板 -->
        <div class="control-panel">
            <label for="driverSelect">👤 司機選單：</label>
            <select id="driverSelect" class="driver-select" disabled>
                <option value="">載入司機名單中...</option>
            </select>
            <button id="btnRefresh" class="btn-refresh">重整任務</button>
        </div>

        <!-- 任務清單區域 -->
        <h3 style="margin-bottom: 10px; color: #475569;">📅 今日派送清單</h3>
        <div id="taskList" class="task-list">
            <div style="color: #94a3b8; font-style: italic;">請先在上方選擇司機姓名以載入今日任務...</div>
        </div>

        <!-- 核對與雙簽收主表單 (點選卡片才展開) -->
        <div class="sheet-container" id="captureArea">
            <div class="header">
                <h1 style="color: #dc2626 !important;">饗賓件數核對單 <span id="flowStatus" style="font-size: 14px; margin-left: 10px; color: #dc2626 !important; font-weight: normal;">( 核對中 )</span></h1>
                <div id="headerInfo" class="info-grid">
                    <div><strong>單號：</strong><span id="orderIdText">--</span></div>
                    <div><strong>日期：</strong><span id="orderDate">--/--/--</span></div>
                    <div><strong>實際到貨時間：</strong><span id="arrivalTime">--:--</span></div>
                    <div><strong>製表人員：</strong><span id="creator">--</span></div>
                </div>
            </div>

            <!-- 橫向三欄式大網格 -->
            <div class="main-grid">
                <div class="column-box" id="col1">
                    <div class="column-title blue-title">1. 溫層與常態出貨項目</div>
                    <table id="table1">
                        <thead><tr><th>項目名稱</th><th style="text-align:center;">預計</th><th style="text-align:center;">實收</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="column-box" id="col2">
                    <div class="column-title green-title">2. 本次出貨 (物流容器)</div>
                    <table id="table2">
                        <thead><tr><th>項目名稱</th><th style="text-align:center;">預計</th><th style="text-align:center;">實收</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="column-box" id="col3">
                    <div class="column-title amber-title">3. 本次回收 (物流容器)</div>
                    <table id="table3">
                        <thead><tr><th>項目名稱</th><th style="text-align:center;">預計</th><th style="text-align:center;">實收</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- 底部雙階段簽章區 -->
            <div class="bottom-section">
                <div class="signature-card" id="driverCard">
                    <div class="signature-header">
                        <span style="color: #2563eb; font-weight: bold;">第一階段：司機確認點收</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="driverCanvas" width="380" height="90" style="width: 100%; max-width: 400px;"></canvas>
                        <button id="clearDriverBtn" class="btn-clear">清除</button>
                    </div>
                    <button id="lockStage1Btn" class="btn btn-blue">完成第一階段點交並鎖定</button>
                </div>

                <div class="signature-card disabled" id="storeCard">
                    <div class="signature-header">
                        <span style="color: #16a34a; font-weight: bold;">第二階段：分店人員簽收</span>
                    </div>
                    <div class="canvas-container">
                        <canvas id="storeCanvas" width="380" height="90" style="width: 100%; max-width: 400px;"></canvas>
                        <button id="clearStoreBtn" class="btn-clear">清除</button>
                    </div>
                    <button id="lockStage2Btn" class="btn btn-green">確認核對並完成簽收（正式鎖檔）</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==================== [⚠️ 請更換成您最新發佈的 GAS 部署網址] ====================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwouLbQE43GFoXp9DpZjIfZV2dcdXcLmcIG2ReCbYkQPc68HzuNijCQdeZuA5t_7G_W/exec"; 
        // ============================================================================

        let currentActiveOrderId = "";
        let currentTasks = [];

        // 初始化手寫板
        function setupCanvas(canvasId, clearBtnId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }
            function startDraw(e) { isDrawing = true; draw(e); }
            function endDraw() { isDrawing = false; ctx.beginPath(); }
            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineWidth = 4;           // 🌟 手寫筆跡線條加粗，保證截圖清晰
                ctx.strokeStyle = '#000000'; // 🌟 筆跡強制為純黑，不再使用灰色
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            }
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('touchstart', startDraw);
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchmove', draw);

            document.getElementById(clearBtnId).addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            return { canvas, ctx };
        }

        const driverSign = setupCanvas('driverCanvas', 'clearDriverBtn');
        const storeSign = setupCanvas('storeCanvas', 'clearStoreBtn');

        // 🟢 動態載入司機名單
        function loadDrivers() {
            fetch(`${GAS_API_URL}?action=get_drivers`)
            .then(res => res.json())
            .then(res => {
                const select = document.getElementById('driverSelect');
                if (res.status === "success" && res.drivers.length > 0) {
                    select.innerHTML = '<option value="">-- 請選擇您的姓名 --</option>';
                    res.drivers.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.innerText = name;
                        select.appendChild(opt);
                    });
                    select.disabled = false;
                } else {
                    select.innerHTML = '<option value="">無配送司機資料</option>';
                }
            })
            .catch(err => {
                document.getElementById('driverSelect').innerHTML = '<option value="">連線錯誤</option>';
            });
        }

        // 🟢 讀取該司機的「今日任務列表」
        function loadDriverTasks() {
            const driver = document.getElementById('driverSelect').value;
            const listDiv = document.getElementById('taskList');
            const sheetForm = document.getElementById('captureArea');
            
            sheetForm.style.display = "none";

            if (!driver) {
                listDiv.innerHTML = '<div style="color: #94a3b8; font-style: italic;">請先在上方選擇司機姓名以載入今日任務...</div>';
                return;
            }

            listDiv.innerHTML = '<div style="color: #64748b;">正在連線試算表，載入今日配送清單...</div>';

            fetch(`${GAS_API_URL}?action=get_tasks&driver=${encodeURIComponent(driver)}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    currentTasks = res.tasks;
                    renderTaskList(res.tasks);
                } else {
                    listDiv.innerHTML = `<div style="color:red;">載入清單失敗：${res.message}</div>`;
                }
            })
            .catch(err => {
                listDiv.innerHTML = '<div style="color:red;">網路連線錯誤，無法載入任務！</div>';
            });
        }

        // 渲染任務卡片
        function renderTaskList(tasks) {
            const listDiv = document.getElementById('taskList');
            if (tasks.length === 0) {
                listDiv.innerHTML = '<div style="color: #94a3b8; font-style: italic;">今日無此司機的配送任務。</div>';
                return;
            }

            listDiv.innerHTML = "";
            tasks.forEach(task => {
                const isDone = task.status === "已簽收鎖定";
                const card = document.createElement('div');
                card.className = `task-card ${isDone ? 'completed' : 'pending'}`;
                card.innerHTML = `
                    <div class="task-header">
                        <span class="store-name">${task.store_name}</span>
                        <span class="task-status-badge ${isDone ? 'status-completed' : 'status-pending'}">${task.status}</span>
                    </div>
                    <div class="task-details">
                        <strong>單號：</strong>${task.order_id}<br>
                        <strong>日期：</strong>${task.date}<br>
                        <strong>實際到貨時間：</strong>${task.arrival_time}
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    if (isDone) {
                        alert("此配送單已完成雙階段簽收鎖檔，無法重複修改。");
                        return;
                    }
                    openOrderForm(task);
                });

                listDiv.appendChild(card);
            });
        }

        // 🟢 點選卡片：即時載入預計件數
        function openOrderForm(task) {
            currentActiveOrderId = task.order_id;
            
            document.querySelector("#table1 tbody").innerHTML = "";
            document.querySelector("#table2 tbody").innerHTML = "";
            document.querySelector("#table3 tbody").innerHTML = "";
            resetSignatureForm();

            document.getElementById('orderIdText').innerText = task.order_id;
            document.getElementById('orderDate').innerText = task.date;
            document.getElementById('creator').innerText = task.creator;
            document.getElementById('arrivalTime').innerText = "--:--";
            
            document.getElementById('flowStatus').innerText = "( 即時載入項目中... )";
            document.getElementById('flowStatus').style.color = "#dc2626";

            const sheetForm = document.getElementById('captureArea');
            sheetForm.style.display = "block";
            sheetForm.scrollIntoView({ behavior: 'smooth', block: 'start' });

            fetch(`${GAS_API_URL}?action=get_order&order_id=${task.order_id}`)
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    renderItems(res.items);
                    document.getElementById('flowStatus').innerText = "( 第一階段：雙方核對中 )";
                } else {
                    alert("載入項目失敗！");
                }
            });
        }

        // 智慧型自動防呆分類
        function renderItems(items) {
            const t1 = document.querySelector("#table1 tbody");
            const t2 = document.querySelector("#table2 tbody");
            const t3 = document.querySelector("#table3 tbody");

            items.forEach(item => {
                const name = item.name.trim();
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="color: #000000; font-weight: bold;">${name}</td>
                    <td align="center" style="color: #000000; font-weight: 800; font-size: 15px;">${item.expected_qty}</td>
                    <td align="center"><input type="number" class="qty-input" data-name="${name}" value="${item.expected_qty}"></td>
                `;

                if (name.includes("回收")) {
                    t3.appendChild(tr);
                } 
                else if (name.includes("箱") || name.includes("桶") || name.includes("籃") || name.includes("藍") || name.includes("車") || name.includes("盒") || name.includes("蓋")) {
                    t2.appendChild(tr);
                } 
                else {
                    t1.appendChild(tr);
                }
            });
        }

        // 第一階段鎖定
        document.getElementById('lockStage1Btn').addEventListener('click', () => {
            if (confirm("確認第一階段：數量核對無誤且司機已簽名？")) {
                // 🌟 改進點：使用 readOnly 而不使用 disabled。
                // 這樣瀏覽器就不會強行把字體抹白/變灰，能保持高強度的深黑字體！
                document.querySelectorAll('.qty-input').forEach(input => {
                    input.readOnly = true;
                    input.style.backgroundColor = '#f8fafc';
                    input.style.color = '#000000';
                    input.style.fontWeight = 'bold';
                    input.style.border = '1px solid #94a3b8';
                });
                
                driverSign.canvas.style.pointerEvents = 'none';
                driverSign.canvas.style.backgroundColor = '#f8fafc';
                document.getElementById('clearDriverBtn').style.display = 'none';
                document.getElementById('lockStage1Btn').style.display = 'none';

                document.getElementById('storeCard').classList.remove('disabled');
                document.getElementById('flowStatus').innerText = '( 第二階段：分店核對簽收中 )';
                document.getElementById('flowStatus').style.color = '#16a34a';

                alert("第一階段確認成功！請將設備移交分店人員進行簽章。");
            }
        });

        // 🌟 核心雙保險：更新試算表數據 + 網頁端自動下載 100% 高對比深黑白底簽單
        function uploadDataAndDownloadScreenshot() {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('arrivalTime').innerText = timeStr;

            // 暫時隱藏按鈕以保證截圖完美美觀
            document.getElementById('clearDriverBtn').style.display = 'none';
            document.getElementById('clearStoreBtn').style.display = 'none';
            document.getElementById('lockStage1Btn').style.display = 'none';
            document.getElementById('lockStage2Btn').style.display = 'none';

            // 1. 收集實收數量
            const finalItems = [];
            document.querySelectorAll(".qty-input").forEach(input => {
                finalItems.push({
                    name: input.getAttribute("data-name"),
                    actual_qty: parseInt(input.value) || 0
                });
            });

            // 2. 呼叫 html2canvas 執行高對比純白底截圖
            html2canvas(document.getElementById('captureArea'), {
                scale: 2.2,                 // 再拉高解析度，確保字體絕不模糊
                useCORS: true,
                backgroundColor: "#ffffff", // 強制渲染底色為 100% 純白色
                logging: false
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                
                // 產生下載行為
                const downloadLink = document.createElement('a');
                downloadLink.href = imgData;
                downloadLink.download = `單號_${currentActiveOrderId}_簽收確認單.png`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);

                // 3. 下載完成後，將數據同步傳回 Google 試算表
                fetch(GAS_API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        order_id: currentActiveOrderId,
                        arrival_time: timeStr,
                        items: finalItems
                    })
                })
                .then(res => res.json())
                .then(result => {
                    if (result.status === "success") {
                        alert("🎉 簽收完成！實收數量已自動更新回試算表，且確認單截圖已成功下載儲存。");
                        loadDriverTasks(); // 重新整理任務卡片
                    } else {
                        alert("試算表數據同步失敗：" + result.message + "\n（但您的簽名確認單截圖已經下載成功！）");
                        restoreButtons();
                    }
                })
                .catch(err => {
                    alert("連線 GAS 伺服器失敗，請檢查網路！\n（但您的簽名確認單截圖已經下載成功！）");
                    restoreButtons();
                });
            }).catch(err => {
                console.error("截圖產生錯誤:", err);
                restoreButtons();
            });
        }

        // 第二階段正式提交
        document.getElementById('lockStage2Btn').addEventListener('click', () => {
            if (confirm("確認核對無誤？系統將同步實收數據回試算表，並自動下載本簽章單截圖。")) {
                storeSign.canvas.style.pointerEvents = 'none';
                storeSign.canvas.style.backgroundColor = '#f8fafc';
                document.getElementById('clearStoreBtn').style.display = 'none';
                document.getElementById('lockStage2Btn').disabled = true;
                document.getElementById('lockStage2Btn').style.backgroundColor = '#9ca3af';
                document.getElementById('lockStage2Btn').innerText = '資料同步與截圖產生中...';

                uploadDataAndDownloadScreenshot();
            }
        });

        function resetSignatureForm() {
            driverSign.ctx.clearRect(0, 0, driverSign.canvas.width, driverSign.canvas.height);
            storeSign.ctx.clearRect(0, 0, storeSign.canvas.width, storeSign.canvas.height);
            
            driverSign.canvas.style.pointerEvents = 'auto';
            driverSign.canvas.style.backgroundColor = '#fff';
            storeSign.canvas.style.pointerEvents = 'auto';
            storeSign.canvas.style.backgroundColor = '#fff';

            document.getElementById('clearDriverBtn').style.display = 'inline-block';
            document.getElementById('clearStoreBtn').style.display = 'inline-block';
            
            document.getElementById('lockStage1Btn').style.display = 'block';
            document.getElementById('lockStage2Btn').style.display = 'block';
            document.getElementById('lockStage2Btn').disabled = false;
            document.getElementById('lockStage2Btn').style.backgroundColor = '#16a34a';
            document.getElementById('lockStage2Btn').innerText = "確認核對並完成簽收（正式鎖檔）";

            document.getElementById('storeCard').classList.add('disabled');
        }

        function restoreButtons() {
            document.getElementById('clearStoreBtn').style.display = 'inline-block';
            document.getElementById('lockStage2Btn').disabled = false;
            document.getElementById('lockStage2Btn').style.backgroundColor = '#16a34a';
            document.getElementById('lockStage2Btn').innerText = "確認核對並完成簽收（正式鎖檔）";
        }

        // 🟢 網頁啟動時：動態去試算表載入司機名單
        window.addEventListener('DOMContentLoaded', () => {
            loadDrivers();
        });

        // 綁定事件
        document.getElementById('driverSelect').addEventListener('change', loadDriverTasks);
        document.getElementById('btnRefresh').addEventListener('click', loadDriverTasks);
    </script>
</body>
</html>
